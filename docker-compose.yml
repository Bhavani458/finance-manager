services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finance
      JWT_SECRET: dev-insecure-change-me
      JWT_ALGORITHM: HS256
      ENV: dev
      AMFI_BASE_URL: https://api.mfapi.in
      CLERK_JWKS_URL: https://charming-gar-94.clerk.accounts.dev/.well-known/jwks.json
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./:/app

volumes:
  pgdata:
